<svg xmlns="http://www.w3.org/2000/svg" width="784" height="258" viewBox="0 0 784 258" role="img" aria-labelledby="title desc">
  <title id="title">额度卡的两种显示位置</title>
  <desc id="desc">左侧卡片在任务栏内，背景透明。右侧卡片浮在任务栏上方，使用实色底以便在壁纸上阅读。百分比为示例数据。</desc>
  <defs>
    <linearGradient id="wallpaper" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#3b655d"/><stop offset="1" stop-color="#152e31"/>
    </linearGradient>
    <linearGradient id="taskbar" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#f6eddf"/><stop offset="1" stop-color="#e7efe8"/>
    </linearGradient>
    <clipPath id="screen-clip"><rect width="360" height="148" rx="10"/></clipPath>
    <g id="screen" clip-path="url(#screen-clip)">
      <rect width="360" height="148" fill="url(#wallpaper)"/>
      <path d="M0 94C65 40 113 29 166 54s94 18 194-48v142H0z" fill="#6c8c76" opacity=".54"/>
      <path d="M0 20c78 12 131 72 206 70S303 63 360 37v111H0z" fill="#b29a75" opacity=".38"/>
      <rect y="98" width="360" height="50" fill="url(#taskbar)"/>
      <path d="M0 98h360" stroke="#fff" stroke-opacity=".65"/>
      <circle cx="224" cy="119" r="7" fill="#edb461"/>
      <path d="M216 130a4 4 0 1 1 0-8 6 6 0 0 1 11 2 3 3 0 1 1 0 6z" fill="#a3c7e7"/>
      <text x="237" y="127" fill="#253a34" font-size="12">18°C</text>
      <path d="m281 126 4-4 4 4" fill="none" stroke="#536b62" stroke-width="1.4"/>
      <circle cx="306" cy="124" r="6" fill="none" stroke="#00705a" stroke-opacity=".39" stroke-width="2"/>
      <circle cx="306" cy="124" r="6" fill="none" stroke="#00705a" stroke-width="2" stroke-linecap="round" stroke-dasharray="28 38" transform="rotate(-90 306 124)"/>
      <rect x="322" y="120" width="13" height="8" rx="1.5" fill="none" stroke="#536b62" stroke-width="1.4"/>
      <path d="M336 122h2v4h-2" fill="#536b62"/>
    </g>
    <g id="meters">
      <g fill="none" stroke-width="2.4" stroke-linecap="round">
        <circle cx="20" cy="18" r="13" stroke="#1f332d" stroke-opacity=".26"/>
        <circle cx="20" cy="18" r="13" stroke="#00705a" stroke-dasharray="59 82" transform="rotate(-90 20 18)"/>
        <circle cx="73" cy="18" r="13" stroke="#1f332d" stroke-opacity=".26"/>
        <circle cx="73" cy="18" r="13" stroke="#885500" stroke-dasharray="38 82" transform="rotate(-90 73 18)"/>
      </g>
      <g fill="#1f332d" font-size="9" text-anchor="middle">
        <text x="20" y="21" font-weight="700">72%</text>
        <text x="46" y="21">5h</text>
        <text x="73" y="21" font-weight="700">46%</text>
        <text x="98" y="21">周</text>
      </g>
    </g>
  </defs>
  <rect x=".5" y=".5" width="783" height="257" rx="15" fill="#f7faf8" stroke="#d8e4dd"/>
  <g font-family="Segoe UI, Microsoft YaHei UI, sans-serif">
    <text x="24" y="33" font-size="17" font-weight="700" fill="#21362f">额度卡的两种显示位置</text>
    <text x="760" y="32" text-anchor="end" font-size="11" fill="#566d63">百分比为示例数据</text>
    <g transform="translate(24 54)">
      <text y="15" font-size="14" font-weight="650" fill="#21362f">在任务栏内</text>
      <text x="360" y="15" text-anchor="end" font-size="12" fill="#365a4d">透明底色</text>
      <use href="#screen" y="28"/>
      <g transform="translate(84 134)">
        <rect x="1" y="1" width="110" height="34" rx="7" fill="none" stroke="#141e1c" stroke-opacity=".33"/>
        <use href="#meters"/>
      </g>
    </g>
    <g transform="translate(400 54)">
      <text y="15" font-size="14" font-weight="650" fill="#21362f">浮在任务栏上方</text>
      <text x="360" y="15" text-anchor="end" font-size="12" fill="#365a4d">实色底</text>
      <use href="#screen" y="28"/>
      <g transform="translate(84 80)">
        <rect x="1" y="1" width="110" height="34" rx="7" fill="#ecf2f0" stroke="#141e1c" stroke-opacity=".33"/>
        <use href="#meters"/>
      </g>
    </g>
  </g>
</svg>
