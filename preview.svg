<svg xmlns="http://www.w3.org/2000/svg" width="620" height="122" viewBox="0 0 620 122" role="img" aria-labelledby="title desc">
  <title id="title">Codex Taskbar Meter</title>
  <desc id="desc">任务栏天气左侧的两个额度圆环，以及右侧的青绿色托盘按钮。百分比为示例。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#203b35"/><stop offset="1" stop-color="#121e20"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="618" height="120" rx="15" fill="#12191c" stroke="#30403d"/>
  <text x="23" y="30" fill="#afc7bd" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="12">Windows 11 任务栏 · 示例数据</text>
  <rect x="20" y="45" width="580" height="58" rx="9" fill="url(#bg)" stroke="#344743"/>
  <g transform="translate(160 52)">
    <rect x="0.5" y="0.5" width="151" height="43" rx="9" fill="#1f2b28" stroke="#3f534d"/>
    <g fill="none" stroke-width="3" stroke-linecap="round">
      <circle cx="27" cy="22" r="15" stroke="#495d55"/>
      <circle cx="27" cy="22" r="15" stroke="#72e7bf" stroke-dasharray="68 95" transform="rotate(-90 27 22)"/>
      <circle cx="96" cy="22" r="15" stroke="#495d55"/>
      <circle cx="96" cy="22" r="15" stroke="#ffc96d" stroke-dasharray="43 95" transform="rotate(-90 96 22)"/>
    </g>
    <g font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="11" fill="#ebf6f1">
      <text x="27" y="26" text-anchor="middle" font-weight="600">72%</text>
      <text x="52" y="26">5h</text>
      <text x="96" y="26" text-anchor="middle" font-weight="600">46%</text>
      <text x="120" y="26">周</text>
    </g>
  </g>
  <g transform="translate(336 59)">
    <circle cx="19" cy="11" r="9" fill="#ffc16b"/>
    <path d="M5 27a6 6 0 0 1 0-12 8 8 0 0 1 15 3 5 5 0 0 1 0 9Z" fill="#9ccbf1"/>
    <text x="35" y="11" fill="#ebf6f1" font-family="Segoe UI, sans-serif" font-size="13">18°C</text>
    <text x="35" y="27" fill="#b6cdc3" font-family="Microsoft YaHei UI, sans-serif" font-size="11">多云</text>
  </g>
  <path d="m486 77 5-5 5 5" stroke="#c1d4cc" stroke-width="1.5" fill="none"/>
  <circle cx="524" cy="74" r="7" fill="none" stroke="#495d55" stroke-width="2.5"/>
  <circle cx="524" cy="74" r="7" fill="none" stroke="#72e7bf" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="32 44" transform="rotate(-90 524 74)"/>
  <rect x="550" y="69" width="15" height="9" rx="2" fill="none" stroke="#c1d4cc" stroke-width="1.5"/>
  <path d="M565 72h2v3h-2" fill="#c1d4cc"/>
</svg>
